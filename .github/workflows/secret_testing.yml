name: Copy API_KEY1 to API_KEY2
on:
  workflow_dispatch:

jobs:
  copy-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Copy secret in same repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SOURCE_VALUE: ${{ secrets.API_KEY1 }}
          REPO: ${{ github.repository }}
        run: |
          echo "::add-mask::$SOURCE_VALUE"
          echo "$SOURCE_VALUE"
          gh variable set API_KEY2_Text --repo "$REPO" --body "$SOURCE_VALUE"

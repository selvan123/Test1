name: Print Secrets
on:
  workflow_dispatch:

jobs:
  copy-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Copy secret in same repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SOURCE_VALUE: ${{ secrets.API_KEY1 }}
          REPO: ${{ github.repository }}
        run: |
          echo "::add-mask::$SOURCE_VALUE"
          echo "$SOURCE_VALUE"
          gh variable set API_KEY2_Text --repo "$REPO" --body "$SOURCE_VALUE"
      - name: Read variable and verify safely
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          VALUE="$(gh variable get API_KEY2_Text --repo "$REPO")"
          echo "Length: ${#VALUE}"
          echo $VALUE
          #echo "Prefix: ${VALUE:0:4}****"

name: MavenHelloWorld CI

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build with Maven (package)
        run: mvn -Xmx3072m -f pom.xml package

      - name: Collect WAR artifacts
        run: |
          mkdir -p ${{ github.workspace }}/artifactstaging
          shopt -s globstar
          cp -v **/*.war ${{ github.workspace }}/artifactstaging/ || true

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: warfile
          path: ${{ github.workspace }}/artifactstaging/